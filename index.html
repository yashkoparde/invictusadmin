<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVICTUS - Admin Portal</title>
</head>
<body>
  <div id="app"></div>
</body>
</html>
<!-- Supabase JS Client -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<!-- config: add .gitignore for dependency and cache artifacts -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #080A0F;
    color: #ECEFF4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
</style>
<style>
  .glass-card {
    background: rgba(13, 17, 23, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid #1E2638;
    border-radius: 8px;
  }
</style>
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #080A0F; }
  ::-webkit-scrollbar-thumb { background: #1E2638; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #FFD60A; }
</style>
<style>
  .btn-gold {
    background: #FFD60A;
    color: #000000;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-gold:hover { filter: brightness(1.1); box-shadow: 0 0 12px rgba(255, 214, 10, 0.4); }
</style>
<header class="header-bar">
  <div class="diamond-logo"><span>I</span></div>
  <div class="header-titles">
    <h1>INVICTUS</h1>
    <span>ADMIN CONSOLE</span>
  </div>
</header>
<style>
  .header-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid #1E2638; background: #000; }
  .diamond-logo { width: 28px; height: 28px; background: #FFD60A; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; margin-right: 14px; box-shadow: 0 0 10px rgba(255, 214, 10, 0.4); }
  .diamond-logo span { transform: rotate(-45deg); color: #000; font-weight: 900; font-size: 13px; }
</style>
<div class="status-badge" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
  <span class="live-dot" style="width:8px; height:8px; background:#10B981; border-radius:50%;"></span>
  <span style="font-size:12px; color:#94A3B8;">SUPABASE CONNECTED</span>
</div>
<a href="https://github.com/yashkoparde/invictus" target="_blank" style="margin-left:16px; color:#64748B; font-size:12px; text-decoration:none;">Main Site &rarr;</a>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('wins')">HALL OF FAME (WINS)</button>
  <button class="tab-btn" onclick="switchTab('events')">TIMELINE EVENTS</button>
</div>
<style>
  .tab-bar { display:flex; gap:16px; padding:16px 24px; border-bottom:1px solid #1E2638; }
  .tab-btn { background:none; border:none; color:#94A3B8; font-weight:600; cursor:pointer; padding:8px 0; border-bottom:2px solid transparent; }
  .tab-btn.active { color:#FFD60A; border-bottom-color:#FFD60A; }
</style>
