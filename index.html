  <meta charset="UTF-8" />

<!-- Supabase JS Client -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<!-- config: add .gitignore for dependency and cache artifacts -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #080A0F;
    color: #ECEFF4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
</style>
<style>
  .glass-card {
    background: rgba(13, 17, 23, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid #1E2638;
    border-radius: 8px;
  }
</style>
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #080A0F; }
  ::-webkit-scrollbar-thumb { background: #1E2638; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #FFD60A; }
</style>
<style>
  .btn-gold {
    background: #FFD60A;
    color: #000000;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-gold:hover { filter: brightness(1.1); box-shadow: 0 0 12px rgba(255, 214, 10, 0.4); }
</style>
